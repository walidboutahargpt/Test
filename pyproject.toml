[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hr_mini_system"
version = "0.1.0"
description = "Lightweight HR mini-system web app for employee forms and reports"
authors = [{ name = "HR Team" }]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["hr", "cli", "forms", "reports"]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
]
dependencies = ["streamlit>=1.36", "reportlab>=3.6"]

[project.scripts]
hr-system = "hr_system:run"

[tool.setuptools]
py-modules = ["hr_system"]
